name: CI

on:
  push:
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python -m ruff check app tests alembic ../data_pipeline
        working-directory: backend
      - run: python -m compileall app alembic ../data_pipeline
        working-directory: backend
      - run: pytest tests --ignore=tests/integration --cov=app --cov-report=term-missing --cov-fail-under=80
        working-directory: backend
        env:
          PYTHONPATH: .:..
          ENVIRONMENT: test
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: openresearch_test
          POSTGRES_USER: openresearch
          POSTGRES_PASSWORD: openresearch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openresearch -d openresearch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://openresearch:openresearch@localhost:5432/openresearch_test
          REDIS_URL: redis://localhost:6379/0
      - run: pytest tests/integration -q
        working-directory: backend
        env:
          RUN_DB_TESTS: "1"
          PYTHONPATH: .:..
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://openresearch:openresearch@localhost:5432/openresearch_test
          REDIS_URL: redis://localhost:6379/0

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run test:run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --target runtime -f backend/Dockerfile .
      - run: docker build --target runner -f frontend/Dockerfile frontend
